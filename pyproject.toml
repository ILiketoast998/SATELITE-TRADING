[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tankfill"
version = "0.1.0"
description = "Estimate floating-roof oil tank fill from Sentinel-2 shadows"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "pystac-client>=0.7",
    "requests>=2.28",
]

[project.optional-dependencies]
planetary = ["planetary-computer>=1.0"]
test = ["pytest>=7"]

[project.scripts]
tankfill = "tankfill.cli:main"

[tool.setuptools]
packages = ["tankfill"]
